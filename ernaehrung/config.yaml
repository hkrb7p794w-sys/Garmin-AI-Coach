name: "Ernährung"
version: "0.3.2"
slug: "ernaehrung"
description: "Mahlzeiten per Foto, Text oder Barcode erfassen – Makros, Mikros und Trainingsbezug"
url: "https://github.com/hkrb7p794w-sys/Garmin-AI-Coach"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:food-apple-outline
panel_title: "Ernährung"
panel_admin: false
# Tagesziele nutzen Trainingsdaten des Garmin AI Coach (sensor.garmin_ai_coach_garmin_energie_heute)
homeassistant_api: true
services:
  - mqtt:want
# /share/ernaehrung/: BLS-Datei für den manuellen Import (falls der Download gesperrt ist)
map:
  - share:rw
backup_exclude:
  - "bls.db"
  - "bls_download"
  - "photos"
options:
  ki_anbieter: "gemini"
  gemini_api_key: ""
  gemini_model: "gemini-3.6-flash"
  lokal_url: ""
  lokal_modell: ""
schema:
  ki_anbieter: "list(gemini|lokal)"
  gemini_api_key: "password"
  gemini_model: "str"
  lokal_url: "str?"
  lokal_modell: "str?"
  lokal_api_key: "password?"
