<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ernährung</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<main id="app">
  <header class="card topbar">
    <div class="row between">
      <button class="iconbtn" id="prevDay" aria-label="Vorheriger Tag"></button>
      <button class="datebtn" id="dateLabel" aria-label="Datum wählen"></button>
      <input type="date" id="datePicker" class="visually-hidden" tabindex="-1">
      <button class="iconbtn" id="nextDay" aria-label="Nächster Tag"></button>
    </div>
    <nav class="nav" role="tablist" aria-label="Ansicht">
      <button class="nb" role="tab" data-view="heute" aria-selected="true"></button>
      <button class="nb" role="tab" data-view="woche"></button>
      <button class="nb" role="tab" data-view="favoriten"></button>
      <button class="nb" role="tab" data-view="einstellungen"></button>
    </nav>
  </header>
  <div id="view"></div>
</main>

<nav class="card capture" aria-label="Mahlzeit erfassen">
  <button class="nb" data-cap="foto"></button>
  <button class="nb" data-cap="text"></button>
  <button class="nb" data-cap="barcode"></button>
  <button class="nb" data-cap="suche"></button>
  <button class="nb" data-cap="wasser"></button>
</nav>

<!-- ohne "capture": iOS bietet Kamera, Fotomediathek und Dateien an -->
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="barcodeInput" accept="image/*" hidden>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet card" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="static/icons.js"></script>
<script src="static/vendor/zxing.min.js"></script>
<script src="static/app.js"></script>
</body>
</html>
