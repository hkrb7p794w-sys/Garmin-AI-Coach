name: "Garmin AI Coach"
version: "0.22.2"
slug: "garmin_ai_coach"
description: "Garmin Trainings-/Recovery-Daten plus KI-Coaching-Notiz für die Ironman-70.3-Vorbereitung"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:watch-variant
panel_title: "Garmin Coach"
services:
  - mqtt:want
# Lesezugriff auf die Home-Assistant-API: CSS aus input_text.zielzeit_schwimm_pace_100m
# für die Ziel-Paces der Schwimm-Workouts in Garmin (garmin_swim.py).
homeassistant_api: true
options:
  garmin_email: ""
  sync_hours: "6,12,20"
  gemini_api_key: ""
  race_date: "2027-08-29"
  race_goal: "Finish in 5:30-6:00 h"
  ai_privacy_mode: "reduziert"
  garmin_schwimm_export: true
schema:
  garmin_email: "str"
  sync_hours: "str"
  gemini_api_key: "password"
  race_date: "str"
  race_goal: "str"
  ai_privacy_mode: "list(reduziert|voll)"
  garmin_schwimm_export: "bool"
map:
  - share:rw
