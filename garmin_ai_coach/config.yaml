  race_date: "2027-08-29"
  race_goal: "Finish in 5:30-6:00 h"
schema:
  garmin_email: "str"
  sync_hour: "int(0,23)"
  gemini_api_key: "password"
  race_date: "str"
  race_goal: "str"
map:
  - share:rw
