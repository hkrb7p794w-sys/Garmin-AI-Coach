name: "Fit Coach"
version: "0.1.1"
slug: "fit_coach"
description: "Garmin + Yazio fürs eigene Dashboard: Lauf-Pace, Gym-Rekorde, Abnehmen und Erfolge"
url: "https://github.com/hkrb7p794w-sys/Garmin-AI-Coach"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: "Fit Coach"
# Seitenleisten-Eintrag (Anmeldeseite) auch für Nicht-Admin-Benutzer
panel_admin: false
services:
  - mqtt:need
# /share/fit_coach/exercise_aliases.json: eigene Übungs-Zuordnungen (optional)
map:
  - share:rw
options:
  sync_hours: "6,12,20"
schema:
  sync_hours: "str"
